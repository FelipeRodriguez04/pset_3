services:
  mlflow:
    image: python:3.12-slim
    working_dir: /mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        pip install --no-cache-dir mlflow==3.18.0 &&
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:////mlflow/backend/mlflow.db
        --artifacts-destination /mlflow/artifacts --serve-artifacts
        --allowed-hosts 'localhost:*,127.0.0.1:*,mlflow:5000'
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_backend:/mlflow/backend
      - mlflow_artifacts:/mlflow/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
volumes:
  mlflow_backend:
  mlflow_artifacts:

